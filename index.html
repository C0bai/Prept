// --- FIX: ICON PLACEHOLDERS ---

const PreptLogoIcon = (props) => (

const ListChecks = (props) => <PlaceholderIcon {...props} title="List Checks"><path d="M3 7l2 2 4-4M3 14h18M3 20h18" /></PlaceholderIcon>;
const Calendar = (props) => <PlaceholderIcon {...props} title="Calendar"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></PlaceholderIcon>;
const PlusCircle = (props) => <PlaceholderIcon {...props} title="Plus Circle"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></PlaceholderIcon>;
const Trash2 = (props) => <PlaceholderIcon {...props} title="Trash"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></PlaceholderIcon>;
const Loader2 = (props) => <PlaceholderIcon {...props} title="Loading"><path d="M21 12a9 9 0 1 1-6.21-8.54" className="origin-center animate-spin" /></PlaceholderIcon>;

const Camera = (props) => <PlaceholderIcon {...props} title="Camera"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3L14.5 4z"/><circle cx="12" cy="13" r="3"/></PlaceholderIcon>;
const X = (props) => <PlaceholderIcon {...props} title="X"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></PlaceholderIcon>;
const Check = (props) => <PlaceholderIcon {...props} title="Check"><polyline points="20 6 9 17 4 12"/></PlaceholderIcon>;
const Search = (props) => <PlaceholderIcon {...props} title="Search"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></PlaceholderIcon>;
const AlertTriangle = (props) => <PlaceholderIcon {...props} title="Alert Triangle"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h18.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></PlaceholderIcon>;
const PenTool = (props) => <PlaceholderIcon {...props} title="Pen Tool"><path d="M12 19l7-7 3 3-7 7-3-3zM18 13l-4-4"/></PlaceholderIcon>;

// --- START OF APP LOGIC ---
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// --- CONFIGURATION & CONSTANTS ---
const LOCAL_STORAGE_KEYS = {
    RECIPES: 'prept_recipes_v2',
    WEEKLY_PLAN: 'prept_weekly_plan_v2',
};

const API_KEY = "AIzaSyDFlGz6KBhcIlnxK7Lvy3veLZM677IC420"; 
const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=' + API_KEY;

const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const MEALS = ['Breakfast', 'Lunch', 'Dinner'];

// JSON Schema for structured recipe output from Gemini (US 5.1)
const RECIPE_JSON_SCHEMA = {
    type: "OBJECT",
    properties: {
        recipeName: { type: "STRING", description: "A creative and descriptive name for the recipe." },
        servings: { type: "STRING", description: "The number of servings or yield of the recipe." },
        prepTime: { type: "STRING", description: "Total time required (e.g., '30 minutes')." },
        instructions: { type: "STRING", description: "Step-by-step preparation guide. Use double newlines (\\n\\n) to separate steps/paragraphs." },
        ingredients: {
            type: "ARRAY",
            description: "A list of all ingredients required.",
            items: {
                type: "OBJECT",
                properties: {
                    name: { type: "STRING", description: "Name of the ingredient (e.g., Chicken Breast, Olive Oil)." },
                    quantity: { type: "STRING", description: "Quantity including units (e.g., 2 large, 1 cup, 500g)." }
                },
                propertyOrdering: ["name", "quantity"]
            }
        }
    },
    required: ["recipeName", "servings", "prepTime", "instructions", "ingredients"],
    propertyOrdering: ["recipeName", "servings", "prepTime", "ingredients", "instructions"]
};

// --- UTILITIES ---

/**
 * Fallback UUID generator for environments lacking crypto.randomUUID(). (FIX for Uncaught TypeError)
 */
const generateUniqueId = () => {
    // Check for native support first
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
    }
    // Fallback using Math.random
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
};


/**
 * Utility to retry fetch operations with exponential backoff.
 */
const withRetry = async (fn, retries = 3) => {
    for (let i = 0; i < retries; i++) {
        try {
            return await fn();
        } catch (error) {
            if (i === retries - 1) {
                console.error("API call failed after all retries:", error);
                throw new Error("Gemini API call failed.");
            }
            const delay = Math.pow(2, i) * 1000;
            console.warn(`Attempt ${i + 1} failed, retrying in ${delay / 1000}s...`);
            await new Promise(resolve => setTimeout(resolve, delay));
        }
    }
};

/**
 * Converts a File object to a Base64 string for the Gemini API.
 */
const base64EncodeImage = (file) => {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
    });
};

/**
 * Custom hook to manage state persistence in LocalStorage (US 1.2).
 */
const useLocalStorageState = (key, defaultValue) => {
    const [state, setState] = useState(() => {
        try {
            const storedValue = localStorage.getItem(key);
            if (storedValue) {
                return JSON.parse(storedValue);
            }
        } catch (error) {
            console.error(`Error reading LocalStorage key "${key}":`, error);
        }
        // Handle initial plan generation default (US 1.2)
        if (key === LOCAL_STORAGE_KEYS.WEEKLY_PLAN && typeof defaultValue === 'function') {
            return defaultValue();
        }
        return defaultValue;
    });

    useEffect(() => {
        try {
            localStorage.setItem(key, JSON.stringify(state));
        } catch (error) {
            console.error(`Error writing to LocalStorage key "${key}":`, error);
        }
    }, [key, state]);

    return [state, setState];
};

/**
 * Component for the Prept Meal Planner (App).
 */
const App = () => {
    // Phase 1: Local Storage Initialization
    const [recipes, setRecipes] = useLocalStorageState(LOCAL_STORAGE_KEYS.RECIPES, []);

    const initialPlanGenerator = useCallback(() => {
        const initialPlan = {};
        DAYS.forEach(day => {
            initialPlan[day.toLowerCase()] = MEALS.reduce((acc, meal) => {
                acc[meal.toLowerCase()] = null;
                return acc;
            }, {});
        });
        return initialPlan;
    }, []);
    
    // Helper to get a clean initial plan object
    const getInitialPlan = initialPlanGenerator;

    const [weeklyPlan, setWeeklyPlan] = useLocalStorageState(LOCAL_STORAGE_KEYS.WEEKLY_PLAN, initialPlanGenerator);

    const [activeView, setActiveView] = useState('plan'); // 'plan', 'recipes', 'list'
    const [isAddModalOpen, setIsAddModalOpen] = useState(false);
    const [editRecipe, setEditRecipe] = useState(null); // Used for editing existing recipes
    const [isLoading, setIsLoading] = useState(false);
    const [systemMessage, setSystemMessage] = useState({ type: '', text: '' }); // 'success', 'error', 'info'

    // --- Data Management Functions (Phase 2 & 3 Logic) ---

    // US 2.2: Add Recipe
    const addRecipe = useCallback((newRecipe) => {
        const recipeWithId = {
            ...newRecipe,
            id: generateUniqueId(), // FIX: Use fallback utility
        };
        setRecipes(prev => [...prev, recipeWithId]);
        setSystemMessage({ type: 'success', text: `Recipe '${newRecipe.name}' added!` });
        return true;
    }, [setRecipes]);

    // US 2.3: Update Recipe
    const updateRecipe = useCallback((updatedRecipe) => {
        setRecipes(prev => prev.map(r => (r.id === updatedRecipe.id ? updatedRecipe : r)));
        setSystemMessage({ type: 'success', text: `Recipe '${updatedRecipe.name}' updated!` });
    }, [setRecipes]);

    // US 2.4: Delete Recipe
    const deleteRecipe = useCallback((recipeId) => {
        // 1. Clear references in weekly plan
        const newPlan = { ...weeklyPlan };
        let planUpdated = false;

        Object.keys(newPlan).forEach(dayKey => {
            Object.keys(newPlan[dayKey]).forEach(mealKey => {
                if (newPlan[dayKey][mealKey] === recipeId) {
                    newPlan[dayKey][mealKey] = null;
                    planUpdated = true;
                }
            });
        });

        if (planUpdated) {
            setWeeklyPlan(newPlan);
        }

        // 2. Remove from recipes list
        setRecipes(prev => prev.filter(r => r.id !== recipeId));
        setSystemMessage({ type: 'success', text: 'Recipe deleted successfully and removed from plan.' });
    }, [setRecipes, setWeeklyPlan, weeklyPlan]);

    // US 3.2: Update Meal Slot
    const updateMealSlot = useCallback((day, meal, recipeId) => {
        const lowerDay = day.toLowerCase();
        const lowerMeal = meal.toLowerCase();

        setWeeklyPlan(prev => ({
            ...prev,
            [lowerDay]: {
                ...(prev[lowerDay] || {}),
                [lowerMeal]: recipeId
            }
        }));
    }, [setWeeklyPlan]);

    // NEW FUNCTION: Clear all meal slots
    const clearAllMealSlots = useCallback(() => {
        if (confirm("Are you sure you want to clear ALL meals from your weekly plan? This action cannot be undone.")) {
            setWeeklyPlan(getInitialPlan());
            setSystemMessage({ type: 'success', text: 'Weekly meal plan cleared!' });
        }
    }, [setWeeklyPlan, getInitialPlan]);


    // --- Shopping List Aggregation (Phase 4 Logic) ---

    // US 4.1: Aggregation Logic
    const aggregateShoppingList = useMemo(() => {
        const ingredientsMap = {}; // { 'chicken breast': ['2 large', '1 lb'], 'salt': ['1 tsp'] }

        Object.keys(weeklyPlan).forEach(dayKey => {
            Object.keys(weeklyPlan[dayKey]).forEach(mealKey => {
                const recipeId = weeklyPlan[dayKey][mealKey];
                if (recipeId) {
                    const recipe = recipes.find(r => r.id === recipeId);
                    if (recipe && recipe.ingredients) {
                        recipe.ingredients.forEach(item => {
                            const nameKey = item.name.toLowerCase().trim();
                            if (!ingredientsMap[nameKey]) {
                                ingredientsMap[nameKey] = new Set();
                            }
                            // Store unique quantity strings for display
                            ingredientsMap[nameKey].add(item.quantity.trim());
                        });
                    }
                }
            });
        });

        // Convert the map to a display array, sorted alphabetically
        return Object.keys(ingredientsMap)
            .sort()
            .map(nameKey => ({
                name: nameKey.charAt(0).toUpperCase() + nameKey.slice(1), // Capitalize first letter
                quantities: Array.from(ingredientsMap[nameKey]).join(', ')
            }));
    }, [weeklyPlan, recipes]);

    // --- AI Generation Logic (Phase 5 Logic) ---

    const handleAIGeneration = useCallback(async (payload, mode) => {
        setIsLoading(true);
        setSystemMessage({ type: 'info', text: `Generating recipe from ${mode}...` });
        
        // Check if API key is present for AI functionality
        if (!API_KEY) {
            setIsLoading(false);
            setSystemMessage({ type: 'error', text: "API Key is missing. AI generation is disabled." });
            console.error("Gemini API Key is not set.");
            return;
        }

        try {
            const systemPrompt = "Act as a professional chef and recipe developer. Generate a complete recipe following the provided JSON schema. Ensure ingredients are detailed with both name and quantity/unit. Do not include any text outside the JSON object.";
            const apiPayload = {
                contents: payload,
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: RECIPE_JSON_SCHEMA
                },
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
            };

            const response = await withRetry(() => fetch(GEMINI_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(apiPayload)
            }));

            if (!response.ok) {
                const errorBody = await response.json();
                throw new Error(errorBody.error?.message || `HTTP error! status: ${response.status}`);
            }

            const result = await response.json();
            const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!jsonText) {
                throw new Error("Received no structured JSON content from the API.");
            }

            const parsedRecipe = JSON.parse(jsonText);

            // US 5.6: Switch to Manual Entry form and pre-fill
            setEditRecipe({
                id: null, // New recipe marker
                name: parsedRecipe.recipeName || '',
                description: '', // AI doesn't typically provide this field, so keep it empty
                servings: parsedRecipe.servings || '',
                prepTime: parsedRecipe.prepTime || '',
                instructions: parsedRecipe.instructions || '',
                ingredients: parsedRecipe.ingredients || [],
            });
            setIsAddModalOpen(true);
            setSystemMessage({ type: 'success', text: `Recipe generated from ${mode}. Please review before saving.` });

        } catch (e) {
            console.error(e);
            setSystemMessage({ type: 'error', text: e.message || `Failed to generate recipe from ${mode}. Please try again.` });
        } finally {
            setIsLoading(false);
        }
    }, [setEditRecipe]);

    // US 5.3: Handle AI Text Submit
    const handleAITextSubmit = useCallback(async (prompt) => {
        const payload = [{ role: "user", parts: [{ text: `Generate a recipe for: ${prompt}` }] }];
        await handleAIGeneration(payload, 'text prompt');
    }, [handleAIGeneration]);

    // US 5.5: Handle AI Image Upload (OCR)
    const handleAIImageUpload = useCallback(async (file) => {
        try {
            const base64Data = await base64EncodeImage(file);
            const payload = [{
                role: "user",
                parts: [
                    { text: "Extract the complete recipe (name, servings, time, ingredients, and instructions) from this image. Structure the output as a single JSON object." },
                    { inlineData: { mimeType: file.type, data: base64Data } }
                ]
            }];
            await handleAIGeneration(payload, 'image (OCR)');
        } catch (e) {
            setSystemMessage({ type: 'error', text: "Error processing image file." });
        }
    }, [handleAIGeneration]);

    // --- UI Component Helpers ---

    const openAddModal = () => {
        setEditRecipe(null); // Ensure we start with a blank slate for new recipe
        setIsAddModalOpen(true);
    };

    const openEditModal = (recipe) => {
        setEditRecipe(recipe);
        setIsAddModalOpen(true);
    };

    const closeAddModal = () => {
        setIsAddModalOpen(false);
        setEditRecipe(null);
        setSystemMessage({ type: '', text: '' });
    };

    const iconClasses = "w-6 h-6 mr-3 text-primary";

    // --- SUB-COMPONENTS START HERE ---

    // Generic Modal Component
    const Modal = ({ isOpen, onClose, title, children, large = false }) => {
        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-gray-900 bg-opacity-75 transition-opacity duration-300 flex items-center justify-center p-4" onClick={onClose}>
                <div
                    className={`bg-white rounded-xl shadow-2xl transform transition-all max-h-[90vh] overflow-y-auto w-full sm:mx-0 mx-4 ${large ? 'sm:max-w-4xl max-w-full' : 'sm:max-w-lg max-w-full'}`}
                    onClick={e => e.stopPropagation()}
                >
                    <div className="p-6 border-b border-gray-200 sticky top-0 bg-white z-10 flex justify-between items-center">
                        <h3 className="text-2xl font-extrabold text-gray-800">{title}</h3>
                        <button onClick={onClose} className="p-2 rounded-full hover:bg-gray-100 transition">
                            <X className="w-6 h-6 text-gray-500" />
                        </button>
                    </div>
                    <div className="p-6">
                        {children}
                    </div>
                </div>
            </div>
        );
    };

    // US 2.2 / US 5.6: Add/Edit/AI Recipe Modal
    const AddRecipeModal = ({ isOpen, onClose, initialRecipe }) => {
            const [mode, setMode] = useState(initialRecipe ? 'manual' : 'ai_text'); // 'manual', 'ai_text', 'ai_image'
            const [formData, setFormData] = useState(initialRecipe || {
                id: null, name: '', description: '', servings: '', prepTime: '', instructions: '', ingredients: [],
            });
            const [aiPrompt, setAiPrompt] = useState('');
            const [imageFile, setImageFile] = useState(null);
            const [showError, setShowError] = useState(false);
            // add refs for two different file inputs
            const captureInputRef = useRef(null);
            const fileInputRef = useRef(null);
            // single handler for both inputs
            const handleFileInput = (e) => {
                const file = e.target.files && e.target.files[0];
                if (file) {
                    setImageFile(file);
                }
            };

        useEffect(() => {
            // Update form data when initialRecipe changes (e.g., pre-filled by AI)
            if (initialRecipe) {
                // Map the structured AI output keys to the internal state keys
                setFormData({
                    id: initialRecipe.id,
                    name: initialRecipe.name,
                    description: initialRecipe.description,
                    servings: initialRecipe.servings,
                    prepTime: initialRecipe.prepTime,
                    instructions: initialRecipe.instructions,
                    ingredients: initialRecipe.ingredients.map(ing => ({
                        name: ing.name || '',
                        quantity: ing.quantity || '',
                        id: generateUniqueId(), // FIX: Use fallback utility
                    })),
                });
                setMode('manual'); // Force manual review mode after AI pre-fill
            } else {
                // If opening for new manual entry, reset
                setFormData({ id: null, name: '', description: '', servings: '', prepTime: '', instructions: '', ingredients: [{ name: '', quantity: '', id: generateUniqueId() }] }); // FIX: Use fallback utility
                setMode('manual');
            }
        }, [initialRecipe]);

        const handleChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: value }));
        };

        const handleIngredientChange = (id, field, value) => {
            setFormData(prev => ({
                ...prev,
                ingredients: prev.ingredients.map(ing =>
                    ing.id === id ? { ...ing, [field]: value } : ing
                ),
            }));
        };

        const addIngredient = () => {
            setFormData(prev => ({
                ...prev,
                ingredients: [...prev.ingredients, { name: '', quantity: '', id: generateUniqueId() }], // FIX: Use fallback utility
            }));
        };

        const removeIngredient = (id) => {
            setFormData(prev => ({
                ...prev,
                ingredients: prev.ingredients.filter(ing => ing.id !== id),
            }));
        };

        const handleSubmit = (e) => {
            e.preventDefault();
            // Simple validation
            if (!formData.name || !formData.instructions || formData.ingredients.every(i => !i.name)) {
                setShowError(true);
                return;
            }
            setShowError(false);

            // Clean ingredients (remove empty ones and temp IDs)
            const finalRecipe = {
                ...formData,
                ingredients: formData.ingredients
                    .filter(i => i.name.trim() !== '' && i.quantity.trim() !== '')
                    .map(({ id, ...rest }) => rest), // Destructure to remove temp ID
            };

            if (finalRecipe.id) {
                updateRecipe(finalRecipe); // US 2.3
            } else {
                addRecipe(finalRecipe); // US 2.2
            }
            onClose();
        };

        // --- Tabs UI (US 5.2, US 5.4) ---
        const TabButton = ({ currentMode, label, icon, onClick }) => (
            <button
                className={`py-2 px-4 rounded-t-lg transition-colors flex items-center ${currentMode === mode
                    ? 'bg-white text-primary font-bold border-b-2 border-primary'
                    : 'bg-gray-50 text-gray-600 hover:bg-gray-100'
                    }`}
                onClick={() => setMode(currentMode) || onClick && onClick()}
                disabled={isLoading}
            >
                {icon} <span className="ml-2">{label}</span>
            </button>
        );

        const aiTextTab = (
            <div className="space-y-4">
                <textarea
                    className="w-full h-32 p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition"
                    placeholder="E.g., A quick, low-carb chicken and broccoli stir-fry for 2, ready in 15 minutes."
                    value={aiPrompt}
                    onChange={(e) => setAiPrompt(e.target.value)}
                    disabled={isLoading}
                ></textarea>
                <button
                    className="w-full py-3 bg-primary text-white font-bold rounded-lg hover:bg-primary-dark transition flex items-center justify-center disabled:opacity-50"
                    onClick={() => handleAITextSubmit(aiPrompt)} // US 5.3
                    disabled={!aiPrompt.trim() || isLoading}
                >
                    {isLoading ? <Loader2 className="w-5 h-5 mr-2" /> : <Zap className="w-5 h-5 mr-2" />}
                    Generate Recipe
                </button>
                {!API_KEY && <p className="text-red-500 text-sm mt-2">AI features require an API key to be set.</p>}

        const manualTab = (

                    <label className="block">

    // US 3.1: Weekly Plan View
    const WeeklyPlanView = () => {
        const [isSelectorOpen, setIsSelectorOpen] = useState(false);
        const [selectedSlot, setSelectedSlot] = useState({ day: null, meal: null });
        const [isMobileView, setIsMobileView] = useState(typeof window !== 'undefined' ? window.innerWidth < 640 : false);

        useEffect(() => {
            const onResize = () => setIsMobileView(window.innerWidth < 640);
            window.addEventListener('resize', onResize);
            return () => window.removeEventListener('resize', onResize);
        }, []);

        const openSelector = (day, meal) => {
            setSelectedSlot({ day, meal });
            setIsSelectorOpen(true);
        };

        const handleSlotUpdate = (recipeId) => {
            if (selectedSlot.day && selectedSlot.meal) {
                updateMealSlot(selectedSlot.day, selectedSlot.meal, recipeId);
                setIsSelectorOpen(false);
            }
        };

        const RecipeSelectorModal = () => {
            const [searchTerm, setSearchTerm] = useState('');
            const filteredRecipes = recipes.filter(r =>
                r.name.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <Modal isOpen={isSelectorOpen} onClose={() => setIsSelectorOpen(false)} title={`Select Meal for ${selectedSlot.day} ${selectedSlot.meal}`}>
                    <input
                        type="text"
                        placeholder="Search recipes..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className="w-full p-2 border border-gray-300 rounded-lg mb-4 focus:ring-primary focus:border-primary"
                    />

                    <div className="space-y-2 max-h-80 overflow-y-auto">

                        <button

                            className="w-full text-center py-3 bg-accent/10 text-accent font-bold rounded-lg hover:bg-accent/20 transition flex items-center justify-center"

                            <Trash2 className="w-5 h-5 mr-2" /> Clear Meal Slot
                        </button>
                        <hr className="my-2" />
                        {filteredRecipes.length > 0 ? (
                            filteredRecipes.map(recipe => (
                                <button
                                    key={recipe.id}
                                    onClick={() => handleSlotUpdate(recipe.id)}
                                    className="w-full text-left p-3 border border-gray-200 rounded-lg hover:bg-primary/10 transition"
                                >
                                    <p className="font-semibold text-primary leading-tight">{recipe.name}</p>
                                    <p className="text-sm text-gray-500">Servings: {recipe.servings || 'N/A'}</p>
                                </button>
                            ))
                        ) : (
                            <p className="text-center text-gray-500 p-4">No recipes found. Try adding one!</p>
                        )}
                    </div>
                </Modal>
            );   // <-- add this closing parenthesis for the return
        };      // <-- end of RecipeSelectorModal

        // Mobile-first stacked view
        if (isMobileView) {
            return (
                <div className="p-4 md:p-8 mobile-page-padding">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-extrabold text-gray-900">Weekly Meal Plan</h2>
                        <button
                            onClick={clearAllMealSlots}
                            className="flex items-center text-sm font-semibold text-accent hover:bg-accent/10 transition p-2 rounded-lg"
                            disabled={Object.values(weeklyPlan).every(day => Object.values(day).every(meal => meal === null))}
                        >
                            <Trash2 className="w-5 h-5 mr-1" /> Clear All
                        </button>
                    </div>

                    <div className="space-y-4">
                        {DAYS.map(day => {
                            const dayKey = day.toLowerCase();
                            return (
                                <div key={day} className="bg-white rounded-xl p-3 app-shadow">
                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="font-bold text-md">{day}</h3>
                                    </div>
                                    <div className="divide-y">
                                        {MEALS.map(meal => {
                                            const mealKey = meal.toLowerCase();
                                            const recipeId = weeklyPlan[dayKey]?.[mealKey];
                                            const recipe = recipes.find(r => r.id === recipeId);
                                            return (
                                                <div key={`${day}-${meal}`} onClick={() => openSelector(day, meal)} className="py-3 cursor-pointer flex justify-between items-center">
                                                    <div>
                                                        <div className="text-sm font-medium text-gray-800">{meal}</div>
                                                        <div className="text-sm text-gray-600">{recipe ? recipe.name : <span className="italic text-gray-400">Tap to plan...</span>}</div>
                                                    </div>
                                                    <div className="text-xs text-gray-400">Edit</div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <RecipeSelectorModal />
                </div>
            );
        }

        // Desktop grid (unchanged behavior)
        return (
            <div className="p-4 md:p-8">
                <div className="flex justify-between items-center mb-6">
                    <h2 className="text-3xl font-extrabold text-gray-900">Weekly Meal Plan</h2>
                    <button
                        onClick={clearAllMealSlots}
                        className="flex items-center text-sm font-semibold text-accent hover:bg-accent/10 transition p-2 rounded-lg"
                        disabled={Object.values(weeklyPlan).every(day => Object.values(day).every(meal => meal === null))}
                    >
                        <Trash2 className="w-5 h-5 mr-1" /> Clear All Meals
                    </button>
                </div>
                
                <div className="overflow-x-auto app-shadow rounded-xl">
                    <div className="grid grid-cols-8 min-w-full lg:min-w-0 bg-white rounded-xl">
                        <div className="p-3 border-r border-b border-gray-200 bg-gray-100 font-bold text-gray-700 text-sm md:text-base rounded-tl-xl">Meal</div>
                        {DAYS.map((day, index) => (
                            <div key={day} className={`p-3 border-r border-b border-gray-200 bg-gray-100 font-bold text-gray-700 text-sm md:text-base text-center ${index === DAYS.length - 1 ? 'rounded-tr-xl border-r-0' : ''}`}>
                                {day}
                            </div>
                        ))}

                        {/* Meal Rows */}
                        {MEALS.map((meal, mealIndex) => (
                            <React.Fragment key={meal}>
                                <div className={`p-3 font-bold text-gray-700 bg-gray-100 border-r border-b border-gray-200 text-sm md:text-base ${mealIndex === MEALS.length - 1 ? 'rounded-bl-xl border-b-0' : ''}`}>{meal}</div>
                                {DAYS.map((day, dayIndex) => {
                                    const dayKey = day.toLowerCase();
                                    const mealKey = meal.toLowerCase();
                                    const recipeId = weeklyPlan[dayKey]?.[mealKey];
                                    const recipe = recipes.find(r => r.id === recipeId);

                                    const isLastRow = mealIndex === MEALS.length - 1;
                                    const isLastCol = dayIndex === DAYS.length - 1;
                                    
                                    return (
                                        <div
                                            key={`${day}-${meal}`}
                                            className={`p-3 border-r border-b border-gray-200 cursor-pointer transition min-h-[80px] ${recipe ? 'bg-primary/5 hover:bg-primary/10' : 'hover:bg-gray-50'} 
                                                ${isLastRow ? 'border-b-0' : ''} 
                                                ${isLastCol ? 'border-r-0' : ''}`}
                                            onClick={() => openSelector(day, meal)}
                                        >
                                            {recipe ? (
                                                <p className="text-sm font-semibold text-primary leading-tight">{recipe.name}</p>

                                                <p className="text-xs text-gray-400 italic">Tap to plan...</p>

                                        </div>
                                    );
                                })}
                            </React.Fragment>
                        ))}
                    </div>
                </div>
                <RecipeSelectorModal />
            </div>
        );
    };

    // US 2.1: Recipe Book View
    const RecipeBookView = () => {
        const [searchTerm, setSearchTerm] = useState('');

        const filteredRecipes = recipes.filter(r =>
            r.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            r.ingredients.some(i => i.name.toLowerCase().includes(searchTerm.toLowerCase()))
        );

        const RecipeCard = ({ recipe }) => (
            <div className="bg-white border border-gray-200 rounded-xl shadow-lg p-5 flex flex-col hover:shadow-xl transition duration-300">
                <h3 className="text-xl font-bold text-gray-800 mb-2">{recipe.name}</h3>
                <p className="text-sm text-gray-500 mb-3 line-clamp-2">{recipe.description || 'No description provided.'}</p>

                <div className="flex justify-between text-sm text-gray-600 mb-4 border-t border-b py-2">
                    <p>Serves: <span className="font-semibold">{recipe.servings || 'N/A'}</span></p>
                    <p>Time: <span className="font-semibold">{recipe.prepTime || 'N/A'}</span></p>
                </div>

                <div className="mt-auto flex space-x-2">
                    <button
                        onClick={() => openEditModal(recipe)}
                        className="flex-1 py-2 px-3 bg-primary/10 text-primary text-sm font-medium rounded-lg hover:bg-primary/20 transition"
                    >
                        Details / Edit
                    </button>
                    <button
                        onClick={() => {
                            // Using a custom modal is preferred over window.confirm, but for quick local setup, this is included.
                            if (confirm(`Are you sure you want to delete "${recipe.name}"? This will remove it from your weekly plan.`)) {
                                deleteRecipe(recipe.id);
                            }
                        }}
                        className="p-2 bg-accent text-white rounded-lg hover:bg-accent-dark transition"
                    >
                        <Trash2 className="w-5 h-5" />
                    </button>
                </div>
            </div>
        );

        return (
            <div className="p-4 md:p-8">
                <div className="flex justify-between items-center mb-6">
                    <h2 className="text-3xl font-extrabold text-gray-900">Your Recipe Book</h2>
                    <button
                        onClick={openAddModal}
                        className="py-2 px-4 bg-primary text-white font-bold rounded-lg hover:bg-primary-dark transition flex items-center shadow-lg"
                    >
                        <PlusCircle className="w-5 h-5 mr-2" /> Add Recipe
                    </button>
                </div>

                <div className="mb-6 relative">
                    <input
                        type="text"
                        placeholder="Search by recipe name or ingredient..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className="w-full p-3 pl-10 border border-gray-300 rounded-xl shadow-inner focus:ring-primary focus:border-primary"
                    />
                    <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                </div>

                {filteredRecipes.length > 0 ? (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filteredRecipes.map(recipe => (
                            <RecipeCard key={recipe.id} recipe={recipe} />
                        ))}
                    </div>
                ) : (
                    <div className="text-center p-12 border-2 border-dashed border-gray-300 rounded-xl bg-white app-shadow">
                        <PreptLogoIcon className="w-12 h-12 text-gray-400 mx-auto mb-4" />
                        <p className="text-lg font-medium text-gray-600">No recipes found.</p>
                        <p className="text-gray-500">Start by adding one manually or generating one with the AI!</p>
                    </div>
                )}
            </div>
        );
    };

    // US 4.1, 4.2: Shopping List View
    const ShoppingListView = () => {
        const [checkedItems, setCheckedItems] = useState(() => {
            try {
                const stored = localStorage.getItem('prept_shopping_checks_v2');
                return stored ? JSON.parse(stored) : {};
            } catch (e) {
                console.error('Failed to parse shopping checks from LocalStorage', e);
                return {};
            }
        });

        const shoppingList = Array.isArray(aggregateShoppingList) ? aggregateShoppingList : [];

        // Single source of truth for persistence
        useEffect(() => {
            try {
                localStorage.setItem('prept_shopping_checks_v2', JSON.stringify(checkedItems));
            } catch (e) {
                console.error('Failed to persist shopping checks to LocalStorage', e);
            }
        }, [checkedItems]);

        const toggleCheck = (name) => {
            const key = String(name || '').trim().toLowerCase();
            setCheckedItems(prev => {
                const next = { ...prev };
                if (next[key]) {
                    delete next[key];
                } else {
                    next[key] = true;
                }
                return next;
            });
        };

        const clearChecks = () => {
            setCheckedItems({});
            try {
                localStorage.removeItem('prept_shopping_checks_v2');
            } catch (e) {
                console.error('Failed to remove shopping checks from LocalStorage', e);
            }
            setSystemMessage({ type: 'info', text: 'Shopping list checkmarks cleared.' });
        };

        if (shoppingList.length === 0) {
            return (
                <div className="text-center p-12 md:p-16 border-2 border-dashed border-gray-300 rounded-xl bg-white app-shadow m-8">
                    <ListChecks className="w-12 h-12 text-gray-400 mx-auto mb-4" />
                    <p className="text-lg font-medium text-gray-600">No Meals Planned!</p>
                    <p className="text-gray-500">Go to the 'Plan' tab to schedule your recipes and generate your list here.</p>
                </div>
            );
        }

        return (
            <div className="p-4 md:p-8 max-w-3xl mx-auto">
                <h2 className="text-3xl font-extrabold text-gray-900 mb-6 flex justify-between items-center">
                    Weekly Shopping List
                    <button
                        onClick={clearChecks}
                        className="text-sm text-accent hover:text-accent font-medium transition flex items-center"
                    >
                        <Trash2 className="w-4 h-4 mr-1" /> Clear Checkmarks
                    </button>
                </h2>

                <div className="bg-white rounded-xl shadow-2xl overflow-hidden divide-y divide-gray-100 app-shadow">
                    {shoppingList.map((item, idx) => {
                        const key = String(item.name || '').trim().toLowerCase();
                        const isChecked = !!checkedItems[key];
                        return (
                            <div
                                key={idx}
                                onClick={() => toggleCheck(item.name)}
                                className={`p-4 flex justify-between items-center cursor-pointer transition ${isChecked ? 'bg-primary/5 opacity-70' : 'hover:bg-gray-50'}`}
                            >
                                <div className="flex items-center">
                                    <input
                                        type="checkbox"
                                        checked={isChecked}
                                        readOnly
                                        className="form-checkbox h-5 w-5 text-primary rounded border-gray-300 mr-4"
                                        style={{ color: '#64B687' }}
                                    />
                                    <span className={`text-lg font-medium text-gray-800 ${isChecked ? 'line-through text-gray-500' : ''}`}>
                                        {item.name}
                                    </span>
                                </div>
                                <span className={`text-sm text-gray-600 ${isChecked ? 'line-through text-gray-400' : 'font-semibold'}`}>
                                    {item.quantities}
                                </span>
                            </div>
                        );
                    })}
                </div>

                <p className="text-center text-sm text-gray-500 mt-6">Quantities are unique entries aggregated from all planned meals.</p>
            </div>
        );
    };


    // --- MAIN APP RENDER ---
    const renderContent = () => {
        switch (activeView) {
            case 'plan':
                return <WeeklyPlanView />;
            case 'recipes':
                return <RecipeBookView />;
            case 'list':
                return <ShoppingListView />;
            default:
                return <WeeklyPlanView />;
        }
    };

    return (
        <div className="min-h-screen bg-app-bg font-sans antialiased flex flex-col">
            {/* Header/Navigation (US 1.3) */}
            <header className="bg-white shadow-md sticky top-0 z-40">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
                    <div className="flex items-center space-x-2">
                        {/* New Logo Icon */}
                        <PreptLogoIcon className="w-8 h-8 text-primary" />
                        <h1 className="text-2xl font-black text-primary">prept</h1>
                    </div>
                    <nav className="flex space-x-2 md:space-x-4">
                        <NavButton icon={Calendar} label="Plan" view="plan" activeView={activeView} setActiveView={setActiveView} />
                        <NavButton icon={PreptLogoIcon} label="Recipes" view="recipes" activeView={activeView} setActiveView={setActiveView} />
                        <NavButton icon={ListChecks} label="List" view="list" activeView={activeView} setActiveView={setActiveView} />
                    </nav>
                </div>
            </header>

            {/* Main Content */}
            <main className="flex-grow max-w-7xl mx-auto w-full">
                {renderContent()}
            </main>

            {/* System Message Bar */}
            {systemMessage.text && (
                <div className={`fixed bottom-0 left-0 right-0 p-4 text-center text-sm font-medium transition-all duration-500 ease-in-out z-50 ${systemMessage.type === 'error' ? 'bg-accent text-white' : systemMessage.type === 'success' ? 'bg-primary text-white' : 'bg-gray-700 text-white'}`}>
                    {systemMessage.text}
                </div>
            )}

            {/* Modals */}
            <AddRecipeModal
                isOpen={isAddModalOpen}
                onClose={closeAddModal}
                initialRecipe={editRecipe}
            />

            {/* Footer for Local Storage Info */}
            <footer className="w-full py-3 text-center text-xs text-gray-500 border-t bg-white">
                Data is stored locally in your browser. No login or internet connection required for data access.
            </footer>
        </div>
    );
};

// Nav Button Helper Component
const NavButton = ({ icon: Icon, label, view, activeView, setActiveView }) => (
    <button
        onClick={() => setActiveView(view)}
        className={`flex items-center px-3 py-2 rounded-lg transition-colors text-sm font-medium ${activeView === view
            ? 'bg-primary text-white shadow-md'
            : 'text-gray-600 hover:bg-gray-100'
            }`}
    >
        <Icon className="w-5 h-5 mr-1" fill={activeView === view ? 'currentColor' : 'none'} />
        {label}
    </button>
);


// Renders the App component into the 'root' div.
const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(<App />);

    </script>
</body>
</html>
